[project]
name = "prismic"
version = "0.1.0"
description = "Cross-platform desktop app for viewing and tagging image/video collections"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.7",
]

[project.scripts]
prismic = "prismic.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prismic"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["prismic"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
