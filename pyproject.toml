[project]
name = "prismic"
version = "0.1.0"
description = "Cross-platform desktop app for viewing and tagging image/video collections"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.7",
]

[project.scripts]
prismic = "prismic.__main__:main"
prismic-build-exe = "prismic._packaging:build_exe"
prismic-installer = "prismic._packaging:build_installer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prismic"]

[dependency-groups]
dev = [
    "imageio-ffmpeg>=0.6.0",
    "mypy>=1.11",
    "pyinstaller>=6.22.3",
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["prismic"]
strict = true

[[tool.mypy.overrides]]
# pytest-qt's QtBot ships without type stubs, so its methods look untyped to mypy.
module = "tests.*"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# Dev-only fixture-generation dependency; ships no type stubs.
module = "imageio_ffmpeg"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
